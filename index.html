    <title>YolUp — Onlayn ta'lim platformasi | Jonli darslar, AI tekshiruv, ota-ona nazorati</title>
    <meta

    <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="YolUp — Onlayn ta'lim platformasi" />

      property="og:description"
      content="Jonli darslar, interaktiv doska, AI uy vazifasi tekshiruvi va ota-ona nazorati — bitta platformada. O'zbek tilida. Tez orada ishga tushadi."

      content="Jonli darslar, interaktiv doska, AI uy vazifasi tekshiruvi va ota-ona nazorati — bitta platformada."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Mavzu React yuklanmasdan OLDIN qo'yiladi — aks holda qorong'i mavzuda
      // oq ekran bir lahza "chaqnab" ketadi.
      (function () {
        try {
          var stored = localStorage.getItem("yolup-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* localStorage o'chirilgan — yorug' mavzu qoladi */
        }
      })();
    </script>

    <!-- Structured data. Pastdagi FAQPage savollari `src/content/site.ts` dagi
         FAQ_ITEMS bilan bir xil bo'lishi kerak — biri o'zgarsa, ikkinchisi ham. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "YolUp",
        "url": "https://yolup.uz/",
        "logo": "https://yolup.uz/logo-mark.png",
        "slogan": "Learn today. Go further.",
        "description": "O'zbekiston uchun onlayn ta'lim platformasi: jonli video darslar, interaktiv doska, AI uy vazifasi tekshiruvi va ota-ona nazorati.",
        "areaServed": "UZ",
        "inLanguage": ["uz", "ru", "en"]
      }
    </script>
    <!-- FAQPage JSON-LD VAQTINCHA YOPILDI.
         Sahifa hozir faqat "Tez orada" ekranini ko'rsatadi (src/content/site.ts
         dagi SHOW_LANDING = false). Google FAQ strukturaviy ma'lumoti sahifada
         KO'RINADIGAN kontentga mos bo'lishini talab qiladi — ko'rinmaydigan FAQ
         uchun qo'lda jazo (manual action) berilishi mumkin.
         SHOW_LANDING = true qilganingizda quyidagi izohni oching.
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Platforma qachon ishga tushadi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Platforma yakuniy sinovdan o'tmoqda. Aniq sana e'lon qilinganda Telegram kanalimizda birinchi bo'lib bildiramiz — hozircha ro'yxatdan o'tish ochiq emas."
            }
          },
          {
            "@type": "Question",
            "name": "Dars yozuvini yuklab olsa bo'ladimi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yo'q. Dars yozuvi faqat platforma ichida ochiladi — yuklab olish tugmasi yo'q, doimiy havola ham yo'q. Har safar 3 soatlik imzolangan havola beriladi."
            }
          },
          {
            "@type": "Question",
            "name": "AI qaysi tilda tekshiradi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Barcha izohlar, xatolar tahlili va tavsiyalar o'zbek tilida yoziladi."
            }
          },
          {
            "@type": "Question",
            "name": "Ota-ona hamma narsani ko'radimi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Faqat bola ruxsat bergan bo'limlarni. Kamera, dars yozuvi va faollik tahlili — har biri alohida yoqiladi, bola istalgan payt bog'lanishni uzishi mumkin."
            }
          },
          {
            "@type": "Question",
            "name": "Qaysi fanlar uchun mos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Har qanday fan uchun. Doskadagi matematik formula rejimi esa matematika kurslarida yoqiladi."
            }
          },
          {
            "@type": "Question",
            "name": "Mobil ilova bormi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Platforma brauzerda — telefonda ham, kompyuterda ham — to'liq ishlaydi. Nativ ilova ishlab chiqilmoqda."
            }
          },
          {
            "@type": "Question",
            "name": "Internet sekin bo'lsa-chi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Doska real vaqtda ishlaydi, aloqa uzilsa avtomatik \"sekin rejim\"ga o'tadi va tiklanganda sinxronlanadi."
            }
          },
          {
            "@type": "Question",
            "name": "Nechta o'quvchi qatnasha oladi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Guruh hajmi cheklanmagan — kichik repetitor guruhidan to'liq sinfgacha."
            }
          },
          {
            "@type": "Question",
            "name": "Ro'yxatdan o'tish qancha vaqt oladi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ochilgandan keyin bir daqiqa. O'qituvchi hisoblari qo'shimcha ravishda administrator tasdig'idan o'tadi."
            }
          }
        ]
      }
    </script>
    -->
  </head>
